[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.ashley:ashley:$ashleyVersion"
  testImplementation platform('org.junit:junit-bom:5.11.4')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

test {
  useJUnitPlatform()
  systemProperty 'java.awt.headless', 'true'
  // Tests load TMX arenas from these folders by path, so a change there reruns them.
  inputs.dir(rootProject.file('assets/levels')).withPropertyName('arenas').withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir(file('src/test/arenas')).withPropertyName('testArenas').withPathSensitivity(PathSensitivity.RELATIVE)
}
